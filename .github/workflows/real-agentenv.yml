name: Real agentenv environment bundle

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build_cache_artifact:
        description: Portable build cache artifact from the calling CI run.
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  HUSKY: "0"
  NODE_OPTIONS: --max-old-space-size=768
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  real-agentenv:
    name: Export and run an environment bundle with the agentenv runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - uses: ./.github/actions/portable-build-cache
        with:
          build_cache_artifact: ${{ inputs.build_cache_artifact }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Acquire the pinned agentenv runner in isolated runner storage and check host Docker
        shell: bash
        run: |
          runner_root="${RUNNER_TEMP}/rea-agentenv-runner"
          python -m venv "${runner_root}"
          "${runner_root}/bin/python" -m pip install --require-virtualenv --no-cache-dir 'agentenv-framework==0.9.1334'
          "${runner_root}/bin/agent-env" --version
          docker version --format '{{.Server.Version}}'
          echo "REA_AGENT_ENV_COMMAND=${runner_root}/bin/agent-env" >> "${GITHUB_ENV}"
          echo "REA_DOCKER_COMMAND=$(command -v docker)" >> "${GITHUB_ENV}"
      - name: Export a bundle from the source-owned capture and run it with the agentenv runner
        run: npm run verify:agentenv:environment
